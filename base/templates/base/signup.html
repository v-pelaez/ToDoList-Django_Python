{% extends 'base/main.html' %}
{% block content %}
<div class="signup">
    <h1>Crear cuenta</h1>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Registrarse">
    </form>
    <p class="auth-footer">¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
</div>
{% endblock %}
