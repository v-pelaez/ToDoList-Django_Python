{% extends 'base/main.html' %}

{% block content %}
<div class="task_form">
    <nav class="nav-back">
        <a href="{% url 'home' %}">← Volver al listado</a>
    </nav>

    <h1>{% if form.instance.id %}Editar Tarea{% else %}Añadir Nueva Tarea{% endif %}</h1>

    <form method="post" class="styled-form">
        {% csrf_token %}
        <div class="form-body">
            {{ form.as_p }}
        </div>
        <input type="submit" value="Guardar Tarea">
    </form>
</div>
{% endblock %}
